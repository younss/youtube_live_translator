[package]
name = "ytlt"
version = "0.1.0"
edition = "2024"
description = "YouTube Live Translator — mini-navigateur Rust façon VLC × Winamp avec sous-titres traduits"

[dependencies]
anyhow = "1"
axum = "0.8"
dirs = "6"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query", "form"] }
rust-embed = "8"
mime_guess = "2"
muda = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "sync", "time"] }
wry = "0.57"
urlencoding = "2"

[profile.release]
lto = "thin"
strip = true
